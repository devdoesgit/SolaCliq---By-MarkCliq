name: solacliq
description: SolaCliq mobile app for solar EPC vendors.
version: 1.0.0+1
publish_to: none

environment:
  sdk: ^3.13.0
  flutter: ^3.47.0

dependencies:
  api_client:
    path: packages/api_client
  bloc: ^9.2.1
  camera: ^0.12.1
  dio: ^5.11.0
  equatable: ^2.0.7
  file_picker: ^13.3.3
  firebase_core: ^5.2.0
  firebase_crashlytics: ^6.1.0
  firebase_messaging: ^17.1.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_localizations:
    sdk: flutter
  flutter_secure_storage: ^11.2.0
  geolocator: ^14.1.2
  go_router: ^18.0.0
  image_picker: ^1.2.4
  intl: ^0.20.2
  material_ui: ^1.1.1
  package_info_plus: ^10.2.2
  sola_ui:
    path: packages/sola_ui
  url_launcher: ^6.3.3
  uuid: ^4.6.0

dev_dependencies:
  bloc_lint: ^0.4.2
  bloc_test: ^10.0.0
  bloc_tools: ^0.1.0-dev.24
  camera_platform_interface: ^2.15.0
  flutter_test:
    sdk: flutter
  geolocator_platform_interface: ^4.4.1
  image_picker_platform_interface: ^2.11.2
  integration_test:
    sdk: flutter
  mocktail: ^1.0.5
  plugin_platform_interface: ^2.1.8
  very_good_analysis: ^11.0.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - shorebird.yaml
