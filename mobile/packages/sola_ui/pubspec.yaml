name: sola_ui
description: SolaCliq design system for Flutter. Tokens, theme, formatters and widgets.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.13.0
  flutter: ^3.47.0

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  very_good_analysis: ^11.0.0

flutter:
  assets:
    - assets/fonts/SpaceGrotesk-OFL.txt
    - assets/fonts/SpaceMono-OFL.txt
  fonts:
    - family: SpaceGrotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk-Variable.ttf
    - family: SpaceMono
      fonts:
        - asset: assets/fonts/SpaceMono-Regular.ttf
        - asset: assets/fonts/SpaceMono-Bold.ttf
          weight: 700
