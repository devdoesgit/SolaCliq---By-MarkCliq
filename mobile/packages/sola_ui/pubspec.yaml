name: sola_ui
description: SolaCliq design system for Flutter. Tokens, theme, formatters and widgets.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.13.0
  flutter: ^3.47.0

dependencies:
  flutter:
    sdk: flutter
  flutter_svg: ^2.3.0
  material_ui: ^1.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  very_good_analysis: ^11.0.0

flutter:
  assets:
    - assets/fonts/Inter-OFL.txt
    - assets/images/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Variable.ttf
