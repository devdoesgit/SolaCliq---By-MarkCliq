# The app's releases and patches, through Shorebird (deploy/README.md,
# "The app from GitHub").
#
# OFF until the owner switches it on: the repo variable APP_PIPELINE = on,
# set once its four secrets are added (repository secrets: on GitHub's free
# plan anyone with write access to the repo can reach them, so only the
# owner has write access). Until then every job is skipped.
#
# - Tag app-v<version> (the version in mobile/pubspec.yaml, e.g.
#   app-v1.0.1+2): a new APK, built and signed by Shorebird, attached to a
#   GitHub Release. Handing it out stays the owner's.
# - Actions → App → Run workflow:
#     patch     a Dart fix for a release, to the `staging` track only:
#               no phone gets it until it's promoted
#     promote   that patch to `stable`: every phone on that release
#     rollback  a patch, everywhere
name: App

on:
  push:
    tags: ["app-v*"]
  workflow_dispatch:
    inputs:
      action:
        description: "patch, promote or rollback"
        type: choice
        options: [patch, promote, rollback]
        required: true
      release_version:
        description: "The release it's for, as in pubspec.yaml (e.g. 1.0.0+1)"
        required: true
      patch_number:
        description: "promote and rollback: the patch's number"
        required: false

# One at a time, and never one cancelled half way.
concurrency:
  group: app-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.47.7"

jobs:
  release:
    name: Release (new APK)
    if: github.event_name == 'push' && vars.APP_PIPELINE == 'on'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7
      - name: The tag matches pubspec.yaml
        run: |
          version="$(sed -n 's/^version: *//p' pubspec.yaml)"
          [[ "$GITHUB_REF_NAME" == "app-v$version" ]] || {
            echo "Tag $GITHUB_REF_NAME, but pubspec.yaml says $version: tag app-v$version." >&2; exit 1; }
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: shorebirdtech/setup-shorebird@v1
        with:
          cache: true
      - name: Signing key and Firebase config, for this run only
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
      - name: Shorebird release
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
          ANDROID_KEYSTORE_ALIAS: solacliq
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEYSTORE_PRIVATE_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          shorebird release android --flavor production -t lib/main_production.dart \
            --artifact apk --flutter-version="$FLUTTER_VERSION" --no-confirm
      - name: GitHub Release with the APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk="solacliq-${GITHUB_REF_NAME#app-v}.apk"
          cp build/app/outputs/flutter-apk/app-production-release.apk "$apk"
          gh release create "$GITHUB_REF_NAME" "$apk" --title "App ${GITHUB_REF_NAME#app-v}" \
            --generate-notes --verify-tag

  patch:
    name: Patch (to the staging track)
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.action == 'patch' &&
      vars.APP_PIPELINE == 'on'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: shorebirdtech/setup-shorebird@v1
        with:
          cache: true
      - name: Signing key and Firebase config, for this run only
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
      # Refused if native code or assets changed: that needs a release.
      - name: Shorebird patch, staging track
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
          RELEASE_VERSION: ${{ inputs.release_version }}
          ANDROID_KEYSTORE_ALIAS: solacliq
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEYSTORE_PRIVATE_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          shorebird patch android --flavor production -t lib/main_production.dart \
            --release-version "$RELEASE_VERSION" --track staging --no-confirm

  manage:
    name: Promote or roll back a patch
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.action != 'patch' &&
      vars.APP_PIPELINE == 'on'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7
      - uses: shorebirdtech/setup-shorebird@v1
        with:
          cache: true
      - name: Shorebird
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
          ACTION: ${{ inputs.action }}
          RELEASE_VERSION: ${{ inputs.release_version }}
          PATCH_NUMBER: ${{ inputs.patch_number }}
        run: |
          [[ "$PATCH_NUMBER" =~ ^[0-9]+$ ]] || { echo "Give the patch's number." >&2; exit 1; }
          shorebird patches "$ACTION" --flavor production \
            --release-version "$RELEASE_VERSION" --patch-number "$PATCH_NUMBER"
