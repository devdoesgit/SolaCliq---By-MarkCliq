# Checks every push to master and every pull request into it, and every
# release before it's built (deploy.yml calls it).
#
# A push or pull request runs only the parts it changed (`changes`); the
# API contract and this file are shared, so a change to them runs all.
# A push to master is compared with the last master commit CI passed,
# not just the push before it, so a push whose run was cancelled,
# skipped or failed is checked by the next one. A release tag always
# runs everything.
name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # paths-filter lists a pull request's files through the API.
  pull-requests: read
  # `changes` looks up the last master commit CI passed.
  actions: read

env:
  FLUTTER_VERSION: "3.47.7"
  NODE_VERSION: "22"
  RUST_VERSION: "1.98.1"

jobs:
  changes:
    name: What changed
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.all.outputs.yes == 'true' || steps.base.outputs.everything == 'true' || steps.filter.outputs.backend == 'true' }}
      contract: ${{ steps.all.outputs.yes == 'true' || steps.base.outputs.everything == 'true' || steps.filter.outputs.contract == 'true' }}
      mobile: ${{ steps.all.outputs.yes == 'true' || steps.base.outputs.everything == 'true' || steps.filter.outputs.mobile == 'true' }}
      admin: ${{ steps.all.outputs.yes == 'true' || steps.base.outputs.everything == 'true' || steps.filter.outputs.admin == 'true' }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Every commit since the last one CI passed must be comparable.
          fetch-depth: 0
      - name: A release runs everything
        id: all
        run: echo "yes=${{ startsWith(github.ref, 'refs/tags/') }}" >> "$GITHUB_OUTPUT"
      - name: The last master commit CI passed
        id: base
        if: steps.all.outputs.yes != 'true' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?branch=master&event=push&status=success&per_page=1" \
            --jq '.workflow_runs[0].head_sha // empty' || true)"
          # None yet, or not in this history (a rewritten branch): check everything.
          if [[ -n "$sha" ]] && git merge-base --is-ancestor "$sha" HEAD; then
            echo "sha=$sha" >> "$GITHUB_OUTPUT"
          else
            echo "everything=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: dorny/paths-filter@v3
        id: filter
        if: steps.all.outputs.yes != 'true' && steps.base.outputs.everything != 'true'
        with:
          # Pushes: from the last passed commit. Pull requests: their own files.
          base: ${{ steps.base.outputs.sha }}
          filters: |
            # The contract, and how clients are made from it (not
            # api/postman, which nothing builds from).
            shared: &shared
              - api/openapi.yaml
              - api/.spectral.yaml
              - api/generator/**
              - .github/workflows/ci.yml
            backend:
              - *shared
              - backend/**
            contract:
              - *shared
              - design/**
              - tools/**
              - Makefile
              - package.json
              - package-lock.json
              - openapitools.json
              # Everything `make check` reads: the generator versions
              # (admin's openapi-typescript) and the formatter settings
              # the generated Dart is written with.
              - admin/package.json
              - admin/package-lock.json
              - admin/src/api/**
              - admin/src/styles/tokens.css
              - mobile/packages/api_client/**
              - mobile/packages/sola_ui/pubspec.*
              - mobile/packages/sola_ui/analysis_options.yaml
              - mobile/packages/sola_ui/lib/src/tokens/**
            mobile:
              - *shared
              - mobile/**
            admin:
              - *shared
              - admin/**
              - legal/**

  backend:
    name: Backend
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    # The same Postgres and logins as `make db`: every test makes its own
    # database in it.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: solacliq
          POSTGRES_PASSWORD: solacliq
          POSTGRES_DB: solacliq
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U solacliq"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgres://solacliq:solacliq@127.0.0.1:5432/solacliq
      APP_DATABASE_URL: postgres://solacliq_api:solacliq_api@127.0.0.1:5432/solacliq
      CARGO_TERM_COLOR: always
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - name: The database's roles
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -f dev-roles.sql
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked --no-fail-fast

  image:
    name: API image
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      # Built only, never pushed: a broken Dockerfile fails here, not at release.
      - uses: docker/build-push-action@v6
        with:
          context: backend
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  contract:
    name: API contract and generated files
    needs: changes
    if: needs.changes.outputs.contract == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            admin/package-lock.json
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: npm ci
      - run: npm ci
        working-directory: admin
      - name: Lint the spec
        run: npx spectral lint api/openapi.yaml --ruleset api/.spectral.yaml --fail-severity error
      - name: Tokens and clients are up to date
        run: make check

  mobile:
    name: Mobile app
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Get packages
        run: |
          (cd packages/sola_ui && flutter pub get)
          (cd packages/api_client && dart pub get)
          flutter pub get
          flutter gen-l10n
        working-directory: mobile
      - name: Format
        run: dart format --set-exit-if-changed lib test packages/sola_ui/lib packages/sola_ui/test
        working-directory: mobile
      - name: Analyze
        run: |
          (cd packages/sola_ui && dart analyze --fatal-infos)
          dart analyze --fatal-infos
        working-directory: mobile
      - name: Test design system (incl. goldens)
        run: flutter test
        working-directory: mobile/packages/sola_ui
      - name: Test app
        run: flutter test
        working-directory: mobile
      - name: Placeholder Firebase config
        # The real file stays out of the repo (F12). The build only needs
        # one of the right shape; these values reach no Firebase project.
        run: |
          cat > android/app/google-services.json <<'JSON'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "solacliq-ci-placeholder",
              "storage_bucket": "solacliq-ci-placeholder.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000000000",
                  "android_client_info": { "package_name": "com.markcliq.solacliq.dev" }
                },
                "api_key": [{ "current_key": "ci-placeholder" }]
              }
            ],
            "configuration_version": "1"
          }
          JSON
        working-directory: mobile
      - name: Build debug APK (development)
        run: flutter build apk --debug --flavor development -t lib/main_development.dart
        working-directory: mobile
      - name: Keep golden failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-failures
          path: mobile/packages/sola_ui/test/goldens/failures/
          if-no-files-found: ignore

  admin:
    name: Admin website
    needs: changes
    if: needs.changes.outputs.admin == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
