        - {tasks_this_month: 23, returned_this_month: 2, avg_minutes_on_site: 288}

    PayoutBank:
      type: object
      properties:
        holder:
          type: string
          maxLength: 100
        account_number:
          type: string
          writeOnly: true
          pattern: "^[0-9]{6,18}$"
          description: Sent to change it; never returned.
        account_last4:
          type: string
          readOnly: true
        ifsc:
          type: string
          pattern: "^[A-Z]{4}0[A-Z0-9]{6}$"
        bank_name:
          type: string
          readOnly: true

    PersonalDetails:
      type: object
      properties:
        phone:
          $ref: "#/components/schemas/Phone"
        address:
          type: string
          maxLength: 200
        emergency_contact:
          type: string
          maxLength: 120
        bank:
          $ref: "#/components/schemas/PayoutBank"

    Settings:
      type: object
      required: [push, whatsapp, sound, language]
      properties:
        push:
          type: boolean
          description: Push notifications for new work, approvals and returns.
        whatsapp:
          type: boolean
          description: A daily WhatsApp summary at 8 pm.
        sound:
          type: boolean
        language:
          type: string
          enum: [en, hi, pa]
      examples:
        - {push: true, whatsapp: true, sound: false, language: en}

    DocumentStatus:
      type: string
      enum: [verified, in_review, needs_fix]

    MyDocument:
      type: object
      required: [kind, status]
