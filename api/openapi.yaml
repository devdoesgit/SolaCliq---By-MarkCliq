      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskProblemCreate"
      responses:
        "200":
          description: Reported.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
              examples:
                reported:
                  $ref: "#/components/examples/Task_reported"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"

