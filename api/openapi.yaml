    KycStatus:
      type: string
      enum: [in_review, needs_fix, approved]

    CommissionStatus:
      type: string
      description: |
        `approved` waits for the customer's advance; `payable` once it is
        paid; `paid` when the admin pays it out.
      enum: [in_review, approved, payable, paid]

    Commission:
      type: object
      required: [amount, status]
