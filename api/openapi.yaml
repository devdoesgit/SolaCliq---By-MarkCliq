  /uploads:
    post:
      operationId: createUpload
      summary: Get a presigned URL to upload one file
      description: |
        The app PUTs the file to `url` with `headers`, then sends
        `upload_id` with the record it belongs to. URLs expire after 15
        minutes. Sample data uses a `.invalid` host, which the development
        app treats as uploaded.
      tags: [uploads]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadCreate"
      responses:
        "201":
          description: Ready for the file.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Upload"
        "401":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"

