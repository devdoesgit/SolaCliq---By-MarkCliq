      summary: Ended, start sent late from offline (illustrative)
      value: {"date": "2026-12-01", "status": "ended", "start": {"at": "2026-12-01T03:42:00Z", "sent_late": true}, "end": {"at": "2026-12-01T13:10:00Z", "sent_late": false}, "minutes": 568}
