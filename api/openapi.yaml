        - name: cursor
          in: query
          description: The previous page's `next_cursor`.
          schema:
            type: string
        - name: limit
          in: query
          schema:
            {type: integer, minimum: 1, maximum: 100, default: 25}
      responses:
        "200":
          description: Done.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminPaymentPage"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"

  /orgs/{org_id}/admin/settings:
    parameters:
      - $ref: "#/components/parameters/OrgId"
    get:
      operationId: adminGetSettings
      summary: The company's settings
      description: |
        Company admins only.
      tags: [admin]
      responses:
        "200":
          description: Done.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSettings"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"

    put:
      operationId: adminSetSettings
      summary: Change the company's settings
      description: |
        Company admins only. An empty or null `upi_id` removes it, and
        with it the "Pay by UPI" button of its customers.
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminSettingsSet"
      responses:
        "200":
          description: Done.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSettings"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"

  /orgs/{org_id}/stages:
    parameters:
      - $ref: "#/components/parameters/OrgId"
    get:
      operationId: listStages
      summary: The company's 7 install stages
      description: |
        Any member. In order, with each stage's template: what a new task
        at that stage asks for. A stage the company hasn't changed has the
        standard name and an empty template.
      tags: [stages]
      responses:
        "200":
          description: Done.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StageList"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"

  /orgs/{org_id}/admin/stages/{index}:
    parameters:
      - $ref: "#/components/parameters/OrgId"
      - name: index
        in: path
        required: true
        description: The stage, from 1 to 7.
        schema:
          {type: integer, minimum: 1, maximum: 7}
    put:
      operationId: adminSetStage
      summary: Change one stage's name and template
      description: |
        Company admins only. Replaces the name, checklist and photos.
        Blank items are dropped and repeats kept once. Tasks already made
        keep what they were made with.
      tags: [stages]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StageTemplateSet"
      responses:
        "200":
          description: All 7 stages, after the change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StageList"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"

  /leads:
    post:
      operationId: createLead
      summary: Send a lead to a company
      description: |
        For a landing page's server, with the company's lead key as the
        bearer token (made in the website's Settings). Never call it from
        a browser: the key would be public. 401 `lead.bad_key` for a
        missing, wrong or replaced key. `consent` must be true (422
        `lead.consent_required`). With an `external_id` already sent, the
        first lead comes back with 200 and nothing changes. At most 300 an
        hour per company (429 `auth.too_many_attempts`).
      tags: [leads]
      security:
        - leadKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LeadCreate"
      responses:
        "200":
          description: Already sent (same `external_id`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeadReceipt"
        "201":
          description: Saved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeadReceipt"
        "401":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/Problem"

  /orgs/{org_id}/leads:
    parameters:
      - $ref: "#/components/parameters/OrgId"
    get:
      operationId: listLeads
      summary: The company's leads, newest first
      description: |
        Company admins only. `q` matches the name, phone, email or city.
      tags: [leads]
      parameters:
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/LeadStatus"
        - name: agent_id
          in: query
          description: Only the leads with this agent.
          schema:
            $ref: "#/components/schemas/Id"
        - name: q
          in: query
          schema:
            {type: string, maxLength: 100}
        - name: cursor
          in: query
          description: The previous page's `next_cursor`.
          schema:
            type: string
        - name: limit
          in: query
          schema:
            {type: integer, minimum: 1, maximum: 100, default: 25}
      responses:
        "200":
          description: Done.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeadPage"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"

  /orgs/{org_id}/leads/mine:
    parameters:
      - $ref: "#/components/parameters/OrgId"
    get:
      operationId: listMyLeads
      summary: The leads handed to the caller, newest first
      description: |
        Sales agents only.
      tags: [leads]
      parameters:
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/LeadStatus"
        - name: cursor
          in: query
          description: The previous page's `next_cursor`.
          schema:
            type: string
        - name: limit
          in: query
          schema:
            {type: integer, minimum: 1, maximum: 100, default: 25}
      responses:
        "200":
          description: Done.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeadPage"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"

  /orgs/{org_id}/leads/{lead_id}:
    parameters:
      - $ref: "#/components/parameters/OrgId"
      - $ref: "#/components/parameters/LeadId"
    get:
      operationId: getLead
      summary: One lead, with everything the form sent
      description: |
        Company admins, or the agent it's with (404 for anyone else).
      tags: [leads]
      responses:
        "200":
          description: Done.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lead"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
    patch:
      operationId: updateLead
      summary: Change a lead's status, note or agent
      description: |
        Company admins: any field. `agent_id` hands it to a Sales Agent of
        the company (422 `lead.not_an_agent` otherwise), who is notified;
        null takes it back. The agent it's with: `status` and `note` only
        (403 `lead.admin_only` for `agent_id`). An empty note removes it.
      tags: [leads]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LeadUpdate"
      responses:
        "200":
          description: Done.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lead"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteLead
      summary: Delete a lead for good
      description: |
        Company admins only. For a person asking to be forgotten.
      tags: [leads]
      responses:
        "204":
          description: Deleted.
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"

  /orgs/{org_id}/admin/lead-key:
    parameters:
      - $ref: "#/components/parameters/OrgId"
    get:
      operationId: adminGetLeadKey
      summary: Whether the company has a lead key
      description: |
        Company admins only. Never the key itself: it's shown once, when
        made.
      tags: [leads]
      responses:
        "200":
          description: Done.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeadKeyInfo"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
    post:
      operationId: adminMakeLeadKey
      summary: Make a new lead key
      description: |
        Company admins only. Returns the key once. Any earlier key stops
        working at once.
      tags: [leads]
      responses:
        "201":
          description: The new key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeadKeyNew"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"

components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: Access token, used by the mobile app.
    cookie:
      type: apiKey
      in: cookie
      name: solacliq_session
      description: Session cookie, used by the admin website.
    leadKey:
      type: http
      scheme: bearer
      description: A company's lead key, for its landing page's server (F20).

  parameters:
    CustomerId:
      name: customer_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Id"
    TaskId:
      name: task_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Id"
    ExpenseId:
      name: expense_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Id"
    LeadId:
      name: lead_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Id"
    OrgId:
      name: org_id
      in: path
      required: true
      description: |
        The org the request is for; the caller needs a membership in it.
        Every `/orgs/{org_id}/...` request answers 403 with `org.not_member`
        (no membership, or it was removed), `org.role_not_allowed` (the
        endpoint is for another role), `org.pending` (MarkCliq hasn't
        approved the company yet), `org.suspended` or `org.rejected`. A
        company that isn't active gives its members none of its data, only
        its name and status in `/me`, so the app shows a message.
      schema:
        $ref: "#/components/schemas/Id"
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque cursor from the previous page's `next_cursor`.
      schema:
        type: string
    Limit:
      name: limit
      in: query
      required: false
      description: Page size.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    AttendanceMonth:
      name: month
      in: query
      required: false
      description: "`YYYY-MM`; this month in India when absent."
      schema:
        type: string
        pattern: "^[0-9]{4}-(0[1-9]|1[0-2])$"
        examples: ["2026-12"]
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        Unique per logical write (UUID). Sent on writes from the mobile app
        so a retry after a lost response never creates a duplicate.
      schema:
        type: string
        format: uuid

  examples:
    AttendanceDay_working:
      summary: Working since 9:12 India time (illustrative)
      value: {"date": "2026-12-01", "status": "working", "start": {"at": "2026-12-01T03:42:00Z", "sent_late": false}}
