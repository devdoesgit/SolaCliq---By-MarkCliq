  /platform/orgs/{org_id}/status:
    parameters:
      - name: org_id
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/Id"
    post:
      operationId: setPlatformOrgStatus
      summary: Approve, reject, suspend or reactivate a company
      description: |
        Platform admins only. Allowed moves: `pending` → `active`
        (approve) or `rejected` (reject); `active` → `suspended`;
        `suspended` → `active`. Anything else is 409
        `org.status_change_not_allowed`. Rejecting needs a `note`, which is
        emailed to the owner (`validation.failed` without one). Approving
        emails the owner how to log in.
      tags: [platform]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrgStatusChange"
      responses:
        "200":
          description: The company, with its new status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformOrg"
