          type: string
          maxLength: 60
          description: Where the person came from, e.g. "Meta ad". Default "Landing page".
        campaign:
          type: string
          maxLength: 100
        page_url:
          type: string
          maxLength: 500
        extra:
          type: object
          maxProperties: 20
          additionalProperties:
            type: string
            maxLength: 200
          description: Any other short answers from the form, by question (keys up to 60 characters).
        consent:
          type: boolean
          description: The person agreed that the company may contact them. Must be true.

    LeadReceipt:
      type: object
      required: [id]
      properties:
        id:
          $ref: "#/components/schemas/Id"

    LeadSummary:
      type: object
      required: [id, name, phone, source, status, received_at]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        name:
          type: string
        phone:
          type: string
          description: Ten digits.
        city:
          type: string
        source:
          type: string
        status:
          $ref: "#/components/schemas/LeadStatus"
        agent_id:
          $ref: "#/components/schemas/Id"
        agent_name:
          type: string
          description: The Sales Agent it's with; both absent when no one has it.
        received_at:
          $ref: "#/components/schemas/Timestamp"

    Lead:
      allOf:
        - $ref: "#/components/schemas/LeadSummary"
        - type: object
          required: [extra]
          properties:
            email:
              type: string
            pin_code:
              type: string
            monthly_bill:
              type: string
            roof_type:
              type: string
            message:
              type: string
            campaign:
              type: string
            page_url:
              type: string
            extra:
              type: object
              additionalProperties:
                type: string
            note:
              type: string
            updated_at:
              $ref: "#/components/schemas/Timestamp"

    LeadPage:
      type: object
      required: [items, page]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/LeadSummary"
        page:
          $ref: "#/components/schemas/PageInfo"

    LeadUpdate:
      type: object
      properties:
        status:
          $ref: "#/components/schemas/LeadStatus"
        note:
          type: string
          maxLength: 1000
        agent_id:
          type: [string, "null"]
          format: uuid
          description: Admins only. Null takes the lead back.

    LeadKeyInfo:
      type: object
      required: [set]
      properties:
        set:
          type: boolean
        made_at:
          $ref: "#/components/schemas/Timestamp"
        last_used_at:
          $ref: "#/components/schemas/Timestamp"

    LeadKeyNew:
      type: object
      required: [key, made_at]
      properties:
        key:
          type: string
          description: Shown once. Keep it on the landing page's server.
        made_at:
          $ref: "#/components/schemas/Timestamp"

    AdminSettingsSet:
      type: object
      properties:
        upi_id:
          type: [string, "null"]
          maxLength: 130
          examples: ["examplesolar@okhdfc"]
