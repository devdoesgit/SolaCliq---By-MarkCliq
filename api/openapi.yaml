    parameters:
      - $ref: "#/components/parameters/OrgId"
      - $ref: "#/components/parameters/TaskId"
      - name: item_id
        in: path
        required: true
        schema:
          type: string
    put:
      operationId: setTaskChecklistItem
      summary: Tick or untick one checklist item
      description: Fails with 409 `task.locked` once submitted.
      tags: [tasks]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [done]
              properties:
                done:
                  type: boolean
      responses:
        "200":
          description: The task, updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
              examples:
                assigned:
