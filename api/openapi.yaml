  /orgs/{org_id}/me/attendance/start:
    parameters:
      - $ref: "#/components/parameters/OrgId"
    post:
      operationId: startAttendanceDay
      summary: Start the caller's working day
      description: |
        Installers and salaried sales (`attendance.not_tracked`, 403, for a
        commission agent). The day is the India date of the tap. Its time
        is the server's clock less how long the tap waited on the phone
        (`sent_at` minus `phone_at`, both by the phone's clock, so a wrong
        phone clock moves nothing). A tap that waited over 5 minutes (sent
        from offline) is marked `sent_late`; a negative wait counts as
        none; over 7 days is refused (`attendance.too_old`, 422). A date
        that already has a start gives `attendance.already_started` (409),
        unless it is this request's own retry, which gets the first answer.
      tags: [attendance]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AttendanceTapCreate"
      responses:
        "201":
          description: Started.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttendanceDay"
              examples:
                started:
                  $ref: "#/components/examples/AttendanceDay_working"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"

  /orgs/{org_id}/me/attendance/end:
    parameters:
      - $ref: "#/components/parameters/OrgId"
    post:
      operationId: endAttendanceDay
      summary: End the caller's working day
      description: |
        Same callers and time rules as start. Ends the day of the tap's
        India date; a day doesn't cross midnight. No start on that date,
        or one after the tap: `attendance.not_started` (409). Already
        ended: `attendance.already_ended` (409). An end can't be undone.
      tags: [attendance]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AttendanceTapCreate"
      responses:
        "200":
          description: Ended.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttendanceDay"
              examples:
                ended:
                  $ref: "#/components/examples/AttendanceDay_ended"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
