        "403":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
    post:
      operationId: createExpense
      summary: Log an expense for the admin to approve
      description: |
        Workers and agents. Goes to the org admin's approvals queue as
        `in_review`, numbered `EXP-0001` per company. A receipt is an
        upload of this company (purpose `receipt`), checked in storage
        (422 on `receipt_upload_id` if it didn't finish); `task_id` must be
        one of the caller's own tasks (422 otherwise).
      tags: [expenses]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExpenseCreate"
      responses:
        "201":
          description: Sent.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Expense"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"

  /orgs/{org_id}/customer-registrations:
    parameters:
      - $ref: "#/components/parameters/OrgId"
    post:
      operationId: submitCustomerRegistration
      summary: An agent registers a customer with their KYC
      description: |
        Agents only. Submits details, site, connection and KYC documents for
        the org admin to approve. On submission the customer's account is
        created, with no password (or an existing one linked), and they
        are emailed at once: who registered them, what was registered,
        and how to set up the app to follow their install. The admin then
        verifies or rejects it; the customer sees the status in the app. Required documents: Aadhaar,
        PAN, electricity bill, land document and signature
        (`registration.document_required`, 422, naming the kind); bank
        proof too when the subsidy is on (`registration.bank_proof_required`,
        422). Roof photo and name change are optional. Each kind once;
        each file an upload of this company (purpose `kyc`), checked in
        storage. 409 `registration.duplicate` when the company already has
        this customer (same email, phone or consumer number), or the
        person is already in the company in another role; the detail says
        who registered them and when.
      tags: [customers]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerRegistrationCreate"
      responses:
        "201":
          description: With the admin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerRegistration"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"

