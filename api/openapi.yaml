  responses:
    Problem:
      description: Error, as RFC 9457 problem details.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"

  schemas:
    Health:
      type: object
      required: [status, version, database]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        version:
          type: string
          description: Backend build version.
          examples: ["0.1.0"]
        database:
          type: string
          enum: [ok, unavailable]

    Problem:
      type: object
      description: RFC 9457 problem details.
      required: [type, title, status, code]
      properties:
        type:
          type: string
          format: uri-reference
          examples: ["https://solacliq.markcliq.com/problems/expense.limit_exceeded"]
        title:
          type: string
          description: Short, human-readable summary.
        status:
          type: integer
        detail:
          type: string
          description: What went wrong and what to do, safe to show to the user.
        instance:
          type: string
          format: uri-reference
        code:
          type: string
          description: Machine-readable error code, `<area>.<reason>`.
          examples: ["expense.limit_exceeded"]
        errors:
          type: array
          description: Per-field validation errors.
          items:
            type: object
            required: [field, message]
            properties:
              field:
                type: string
              message:
                type: string

    Id:
      type: string
      format: uuid
      description: UUIDv7.

    Timestamp:
      type: string
      format: date-time
      description: ISO 8601, UTC.

    Money:
      type: integer
      format: int64
      description: Amount in paise (₹1 = 100). Never a float.
      examples: [18500000]

    PageInfo:
      type: object
      required: [next_cursor]
      properties:
        next_cursor:
          type: [string, "null"]
          description: Pass as `cursor` for the next page; null on the last page.

    Email:
      type: string
      format: email
      maxLength: 254
      examples: ["asha@example.com"]

    Phone:
      type: string
      description: Indian mobile number, 10 digits, without +91.
      pattern: "^[6-9][0-9]{9}$"
      examples: ["9876511223"]

    Password:
      type: string
      description: At least 8 characters, including a number.
      minLength: 8
      maxLength: 128
      format: password

    VerificationCode:
      type: string
      pattern: "^[0-9]{6}$"
      description: 6-digit code from the email.
      examples: ["482913"]

    SignupRequest:
      type: object
      required: [name, email, password]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          examples: ["Asha Example (illustrative)"]
        email:
          $ref: "#/components/schemas/Email"
        phone:
          $ref: "#/components/schemas/Phone"
        password:
          $ref: "#/components/schemas/Password"

    EmailRequest:
      type: object
      required: [email]
      properties:
        email:
          $ref: "#/components/schemas/Email"

    VerifyEmailRequest:
      type: object
      required: [email, code]
      properties:
        email:
          $ref: "#/components/schemas/Email"
        code:
          $ref: "#/components/schemas/VerificationCode"

    LoginRequest:
      type: object
      required: [email, password, client]
      properties:
        email:
          $ref: "#/components/schemas/Email"
        password:
          type: string
          minLength: 1
          maxLength: 128
          format: password
        client:
          type: string
          enum: [app, web]
          description: "`app` gets tokens in the body; `web` gets a session cookie."

    LoginResponse:
      type: object
      required: [user]
      properties:
        user:
          $ref: "#/components/schemas/Me"
        tokens:
          description: "Present for `client: app` only."
          $ref: "#/components/schemas/TokenPair"

    RefreshRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token:
          type: string

    TokenPair:
      type: object
      required: [access_token, refresh_token, access_expires_in, token_type]
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
          description: Single use; the next refresh returns a new one.
        access_expires_in:
          type: integer
          description: Seconds until the access token expires.
          examples: [900]
        token_type:
          type: string
          enum: [Bearer]

    ResetPasswordRequest:
      type: object
      required: [email, code, new_password]
      properties:
        email:
          $ref: "#/components/schemas/Email"
        code:
          $ref: "#/components/schemas/VerificationCode"
        new_password:
          $ref: "#/components/schemas/Password"

    OrgStatus:
      type: string
      enum: [pending, active, suspended]

    Role:
      type: string
      description: |
        `customer`: the company installs for this person; they follow the
        install in the app.
      enum: [org_admin, worker, agent, customer]

    Membership:
      type: object
      required: [org, role]
      properties:
        org:
          type: object
          required: [id, name, status]
          properties:
            id:
              $ref: "#/components/schemas/Id"
            name:
              type: string
              examples: ["Example Solar (illustrative)"]
            status:
              $ref: "#/components/schemas/OrgStatus"
            phone:
              $ref: "#/components/schemas/Phone"
              description: The company's number, for its people to call.
        role:
          $ref: "#/components/schemas/Role"
        pay_type:
          type: string
          enum: [commission, salary]
          description: |
            Agents (shown as Sales) only. `commission` agents enter a
            commission on each customer they add; `salary` employees have
            no commission step.

    Me:
      type: object
      required: [id, name, email, email_verified, is_platform_admin, memberships]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        name:
          type: string
          examples: ["Asha Example (illustrative)"]
        email:
          $ref: "#/components/schemas/Email"
        phone:
          $ref: "#/components/schemas/Phone"
        email_verified:
          type: boolean
        is_platform_admin:
          type: boolean
        memberships:
          type: array
          items:
            $ref: "#/components/schemas/Membership"

    MemberStatus:
      type: string
      description: "`invited` until the person has set a password."
      enum: [invited, active]

    Member:
      type: object
      required: [user_id, name, email, role, status, added_at]
      properties:
        user_id:
          $ref: "#/components/schemas/Id"
        name:
          type: string
          examples: ["Ravi Example (illustrative)"]
        email:
          $ref: "#/components/schemas/Email"
        role:
          $ref: "#/components/schemas/Role"
        status:
          $ref: "#/components/schemas/MemberStatus"
        added_at:
          $ref: "#/components/schemas/Timestamp"

    MemberPage:
      type: object
      required: [items, page]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Member"
