  /orgs/{org_id}/tasks/{task_id}/photos:
    parameters:
      - $ref: "#/components/parameters/OrgId"
      - $ref: "#/components/parameters/TaskId"
    post:
      operationId: addTaskPhoto
      summary: Attach a proof photo to one of the task's photo slots
      description: |
        The photo comes from the live camera only, never the gallery, and
        carries where and when it was taken. The server flags photos far
        from the site, with poor accuracy or a mocked location; flags go to
        the admin, nothing is refused. Replaces an earlier photo in the
        slot (a retake). 409 `task.locked` once submitted.
      tags: [tasks]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProofPhotoCreate"
      responses:
        "200":
          description: The task, updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
              examples:
                assigned:
                  $ref: "#/components/examples/Task_assigned"
                ready:
                  $ref: "#/components/examples/Task_ready"
                returned:
                  $ref: "#/components/examples/Task_returned"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"

