                $ref: "#/components/schemas/AttendanceDay"
                description: Absent when they haven't started on this date.
      examples:
        - date: "2026-12-01"
          people:
            - person: {user_id: 01928f6e-0000-7000-8000-0000000000b1, name: Ravi Example (illustrative), role: worker, removed: false}
              day: {date: "2026-12-01", status: working, start: {at: "2026-12-01T03:42:00Z", sent_late: false}}
            - person: {user_id: 01928f6e-0000-7000-8000-0000000000b2, name: Suresh Example (illustrative), role: worker, removed: false}
            - person: {user_id: 01928f6e-0000-7000-8000-0000000000b3, name: Aman Example (illustrative), role: agent, removed: false}
              day: {date: "2026-12-01", status: ended, start: {at: "2026-12-01T04:00:00Z", sent_late: true}, end: {at: "2026-12-01T12:30:00Z", sent_late: false}, minutes: 510}

