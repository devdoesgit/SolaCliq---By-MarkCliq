          type: string
        system_kw:
          type: number
        place:
          type: string
        kyc_status:
          $ref: "#/components/schemas/KycStatus"
        detail:
          type: string
          description: One line on where it stands, composed by the server.
        sent_at:
          $ref: "#/components/schemas/Timestamp"
        commission:
          $ref: "#/components/schemas/Commission"

    CustomerList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/CustomerSummary"

