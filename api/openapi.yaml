        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"

  /orgs/{org_id}/tasks/{task_id}/submit:
    parameters:
      - $ref: "#/components/parameters/OrgId"
      - $ref: "#/components/parameters/TaskId"
    post:
      operationId: submitTask
      summary: Send the finished work to the admin for approval
      description: |
        Needs every photo slot filled and every checklist item done
        (422 `task.incomplete`). The task becomes `submitted` and its photos
        lock until the admin approves or returns it.
      tags: [tasks]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                note:
                  type: string
                  maxLength: 500
                  description: Optional note for the admin.
      responses:
        "200":
          description: Submitted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
              examples:
                submitted:
                  $ref: "#/components/examples/Task_submitted"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"

