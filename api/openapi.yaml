openapi: 3.1.0
info:
  title: SolaCliq API
  version: 0.5.0
  contact:
    name: MarkCliq
    url: https://markcliq.com
    email: info@markcliq.com
  description: |
    Writes that carry the website's cookies must come from the website
    itself: from another origin they are 403 `auth.cross_origin`.

    Contract between the SolaCliq backend, mobile app and admin website.
    Conventions are in docs/architecture.md under "API conventions":
    money in integer paise, UUIDv7 ids, ISO 8601 UTC timestamps, cursor
    pagination, RFC 9457 errors.
servers:
  - url: https://solacliq.markcliq.com/api/v1
    description: Production
  - url: http://localhost:4010
    description: Prism mock (make mock)

security:
  - bearer: []
  - cookie: []

tags:
  - name: system
    description: Service status.
  - name: auth
    description: Accounts, login and sessions (F1).
  - name: team
    description: An org's workers and agents (F3).
  - name: onboarding
    description: Solar companies registering with SolaCliq.
  - name: platform
    description: MarkCliq reviewing and managing companies (platform admins only).
  - name: quotes
    description: People without an installer asking for a solar quote (leads).
  - name: home
    description: What each home screen shows.
  - name: expenses
    description: Workers and agents logging costs for approval (F7).
  - name: customers
    description: Agents registering customers with their KYC (F4).
  - name: uploads
    description: Files go straight to storage through presigned URLs.
  - name: tasks
    description: A worker's assigned work, proof photos and approvals (F6).
  - name: notifications
    description: What changed for the caller in one company (F12).
  - name: profile
    description: The person's details, documents and settings.
  - name: install
    description: A customer's own install and payments.
  - name: admin
    description: The company's side of each flow, for the admin website.
  - name: attendance
    description: Installers and salaried sales marking their working day (F17).
  - name: stages
    description: Each company's 7 install stages and their templates (F19).
  - name: leads
    description: Landing-page leads sent to a company, tracked and assigned (F20).

paths:
  /health:
    get:
      operationId: getHealth
      summary: Service health
      description: |
        Whether the API and its database are up. Needs no authentication.
        503 with the same body when the database can't be reached.
      tags: [system]
      security: []
      responses:
        "200":
          description: The API is up.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          description: The API is up but the database is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"

  /auth/signup:
    post:
      operationId: signup
      summary: Start signing up (email a code)
      description: |
        Step 1 of 3, also how to ask for another code (one a minute).
        Creates no account. Always 202, whether or not the email has an
        account (no enumeration): one with a password gets a "you already
        have an account" email instead of a code. An account made for
        someone (invited, registered by an agent) gets a code and can
        finish this way. 429 after 3 an hour for one email, whether or
        not it has an account, or over the per-IP limit.
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailRequest"
      responses:
        "202":
          description: Accepted; a code is on its way if the email can sign up.
        "422":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/Problem"

  /auth/signup/verify:
    post:
      operationId: verifySignup
      summary: Prove the inbox with the code
      description: |
        Step 2 of 3. Returns a one-time setup token for step 3. Codes last
        5 minutes and allow 5 tries. A wrong, expired, used-up or never
        sent code all answer 400 `auth.code_invalid`, so the reply can't
        show which emails have accounts; 429 is only the per-IP limit.
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifySignupRequest"
      responses:
        "200":
          description: The inbox is proven.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignupSetup"
        "400":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/Problem"

  /auth/signup/complete:
    post:
      operationId: completeSignup
      summary: Create the account and log in
      description: |
        Step 3 of 3, with the setup token. Only now is the account made
        (or, if someone made it for this person, completed): name, mobile,
        password and the agreement to the terms are what was sent here,
        nothing from before. Answers as an app login. The token works once
        and for 15 minutes: after that, or if the account got a password
        meanwhile, 400 `auth.signup_expired`.
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompleteSignupRequest"
      responses:
        "200":
          description: Created and logged in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/Problem"

  /auth/login:
    post:
      operationId: login
      summary: Log in
      description: |
        `client: app` returns a token pair in the body. `client: web` sets
        the access and refresh cookies and returns no tokens. An unknown
        email, a wrong password and an account with no password yet all
        give the same `auth.invalid_credentials`, so log in can't show
        which emails have accounts or were invited. Someone invited sets
        a password through /auth/password/forgot and /reset, or signs up.
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Logged in.
          headers:
            Set-Cookie:
              description: |
                Web clients only, two cookies, both HttpOnly, Secure and
                SameSite=Lax: `solacliq_session` (the access token, Path=/,
                Max-Age = the access lifetime) and `solacliq_refresh` (the
                refresh token, Path=/api/v1/auth/refresh, Max-Age = the
                refresh lifetime). (The example omits Secure so the mock
                works over plain HTTP in development.)
              schema:
                type: string
              example: solacliq_session=mock-session; Path=/; HttpOnly; SameSite=Lax; Max-Age=900
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
              examples:
                personal:
                  summary: A person with no company (a normal user)
                  value:
                    {"user": {"id": "01928f6e-0000-7000-8000-000000000001", "name": "Asha Example (illustrative)", "email": "asha@example.com", "email_verified": true, "is_platform_admin": false, "terms": {"accepted_version": 1, "current_version": 1}, "memberships": []}, "tokens": {"access_token": "mock-access", "refresh_token": "mock-refresh", "access_expires_in": 900, "token_type": "Bearer"}}
                customer:
                  summary: A customer whose installer added them
                  value:
                    {"user": {"id": "01928f6e-0000-7000-8000-000000000006", "name": "Rajinder Example (illustrative)", "email": "rajinder@example.com", "email_verified": true, "is_platform_admin": false, "terms": {"accepted_version": 1, "current_version": 1}, "memberships": [{"org": {"id": "01928f6e-0000-7000-8000-0000000000a1", "name": "Example Solar (illustrative)", "status": "active"}, "role": "customer"}]}, "tokens": {"access_token": "mock-access", "refresh_token": "mock-refresh", "access_expires_in": 900, "token_type": "Bearer"}}
                worker:
                  summary: A worker in one org
                  value:
                    {"user": {"id": "01928f6e-0000-7000-8000-000000000002", "name": "Ravi Example (illustrative)", "email": "ravi@example.com", "email_verified": true, "is_platform_admin": false, "terms": {"accepted_version": 1, "current_version": 1}, "memberships": [{"org": {"id": "01928f6e-0000-7000-8000-0000000000a1", "name": "Example Solar (illustrative)", "status": "active"}, "role": "worker"}]}, "tokens": {"access_token": "mock-access", "refresh_token": "mock-refresh", "access_expires_in": 900, "token_type": "Bearer"}}
                agent:
                  summary: An agent in one org
                  value:
                    {"user": {"id": "01928f6e-0000-7000-8000-000000000003", "name": "Meena Example (illustrative)", "email": "meena@example.com", "email_verified": true, "is_platform_admin": false, "terms": {"accepted_version": 1, "current_version": 1}, "memberships": [{"org": {"id": "01928f6e-0000-7000-8000-0000000000a1", "name": "Example Solar (illustrative)", "status": "active"}, "role": "agent"}]}, "tokens": {"access_token": "mock-access", "refresh_token": "mock-refresh", "access_expires_in": 900, "token_type": "Bearer"}}
                multi_org:
                  summary: An agent in two orgs and a worker in a third, one suspended
                  value:
                    {"user": {"id": "01928f6e-0000-7000-8000-000000000004", "name": "Kiran Example (illustrative)", "email": "kiran@example.com", "email_verified": true, "is_platform_admin": false, "terms": {"accepted_version": 1, "current_version": 1}, "memberships": [{"org": {"id": "01928f6e-0000-7000-8000-0000000000a1", "name": "Example Solar (illustrative)", "status": "active"}, "role": "agent"}, {"org": {"id": "01928f6e-0000-7000-8000-0000000000a2", "name": "Sample Rooftops (illustrative)", "status": "active"}, "role": "agent"}, {"org": {"id": "01928f6e-0000-7000-8000-0000000000a3", "name": "Demo Power (illustrative)", "status": "suspended"}, "role": "worker"}]}, "tokens": {"access_token": "mock-access", "refresh_token": "mock-refresh", "access_expires_in": 900, "token_type": "Bearer"}}
                org_admin:
                  summary: An org admin (their tools are on the website)
                  value:
                    {"user": {"id": "01928f6e-0000-7000-8000-000000000005", "name": "Dev Example (illustrative)", "email": "dev@example.com", "email_verified": true, "is_platform_admin": false, "terms": {"accepted_version": 1, "current_version": 1}, "memberships": [{"org": {"id": "01928f6e-0000-7000-8000-0000000000a1", "name": "Example Solar (illustrative)", "status": "active"}, "role": "org_admin"}]}, "tokens": {"access_token": "mock-access", "refresh_token": "mock-refresh", "access_expires_in": 900, "token_type": "Bearer"}}
        "401":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/Problem"

  /auth/refresh:
    post:
      operationId: refreshSession
      summary: Get new tokens
      description: |
        OAuth 2.1 rotation, for the app and the website alike: returns a
        new access token and a new refresh token, and the old refresh token
        stops working. Reusing an old refresh token revokes that login. A
        dead refresh token gets 401 `auth.session_expired`; the client logs
        out. Clients run one refresh at a time.

        The app sends `RefreshRequest` and gets a `TokenPair`. The website
        sends no body (its `solacliq_refresh` cookie goes along) and gets
        204 with new cookies.
      tags: [auth]
      security: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: New tokens (app).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPair"
        "204":
          description: New cookies (website), as set by /auth/login.
        "401":
          $ref: "#/components/responses/Problem"

  /auth/logout:
    post:
      operationId: logout
      summary: Log out of this session
      description: |
        Revokes this session: its access and refresh tokens stop working at
        once. Web clients also get both cookies cleared.
      tags: [auth]
      responses:
        "204":
          description: Logged out.
          headers:
            Set-Cookie:
              description: Web clients only. Clears `solacliq_session` and `solacliq_refresh`.
              schema:
                type: string
              example: solacliq_session=; Path=/; HttpOnly; SameSite=Lax; Max-Age=0
        "401":
          $ref: "#/components/responses/Problem"

  /auth/password/forgot:
    post:
      operationId: forgotPassword
      summary: Email a password reset or set-up code
      description: |
        Always 202 (no enumeration). Also used to set a first password on an
        account created for someone. Codes last 5 minutes.
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailRequest"
      responses:
        "202":
          description: Accepted.
        "429":
          $ref: "#/components/responses/Problem"

  /auth/password/reset:
    post:
      operationId: resetPassword
      summary: Set a new password with the reset code
      description: Ends every session of the account.
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordRequest"
      responses:
        "204":
          description: Password changed; log in again.
        "400":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/Problem"

  /me:
    get:
      operationId: getMe
      summary: The signed-in person and their memberships
      description: Used by both apps on start-up to restore the session.
      tags: [auth]
      responses:
        "200":
          description: The current user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
              examples:
                personal:
                  summary: A person with no company (a normal user)
                  value:
                    id: 01928f6e-0000-7000-8000-000000000001
                    name: Asha Example (illustrative)
                    email: asha@example.com
                    email_verified: true
                    is_platform_admin: false
                    terms: { accepted_version: 1, current_version: 1 }
                    memberships: []
                customer:
                  summary: A customer whose installer added them
                  value:
                    id: 01928f6e-0000-7000-8000-000000000006
                    name: Rajinder Example (illustrative)
                    email: rajinder@example.com
                    email_verified: true
                    is_platform_admin: false
                    terms: { accepted_version: 1, current_version: 1 }
                    memberships:
                      - org: {id: 01928f6e-0000-7000-8000-0000000000a1, name: Example Solar (illustrative), status: active}
                        role: customer
                worker:
                  summary: A worker in one org
                  value:
                    id: 01928f6e-0000-7000-8000-000000000002
                    name: Ravi Example (illustrative)
                    email: ravi@example.com
                    email_verified: true
                    is_platform_admin: false
                    terms: { accepted_version: 1, current_version: 1 }
                    memberships:
                      - org: {id: 01928f6e-0000-7000-8000-0000000000a1, name: Example Solar (illustrative), status: active}
                        role: worker
                agent:
                  summary: An agent in one org
                  value:
                    id: 01928f6e-0000-7000-8000-000000000003
                    name: Meena Example (illustrative)
                    email: meena@example.com
                    email_verified: true
                    is_platform_admin: false
                    terms: { accepted_version: 1, current_version: 1 }
                    memberships:
                      - org: {id: 01928f6e-0000-7000-8000-0000000000a1, name: Example Solar (illustrative), status: active, phone: "9814000000"}
                        role: agent
                        pay_type: commission
                sales:
                  summary: A salaried sales employee in one org
                  value:
                    id: 01928f6e-0000-7000-8000-000000000007
                    name: Aman Example (illustrative)
                    email: aman@example.com
                    email_verified: true
                    is_platform_admin: false
                    terms: { accepted_version: 1, current_version: 1 }
                    memberships:
                      - org: {id: 01928f6e-0000-7000-8000-0000000000a1, name: Example Solar (illustrative), status: active, phone: "9814000000"}
                        role: agent
                        pay_type: salary
                multi_org:
                  summary: An agent in two orgs and a worker in a third, one suspended
                  value:
                    id: 01928f6e-0000-7000-8000-000000000004
                    name: Kiran Example (illustrative)
                    email: kiran@example.com
                    email_verified: true
                    is_platform_admin: false
                    terms: { accepted_version: 1, current_version: 1 }
                    memberships:
                      - org: {id: 01928f6e-0000-7000-8000-0000000000a1, name: Example Solar (illustrative), status: active}
                        role: agent
                        pay_type: commission
                      - org: {id: 01928f6e-0000-7000-8000-0000000000a2, name: Sample Rooftops (illustrative), status: active}
                        role: agent
                        pay_type: commission
                      - org: {id: 01928f6e-0000-7000-8000-0000000000a3, name: Demo Power (illustrative), status: suspended}
                        role: worker
                org_admin:
                  summary: An org admin (their tools are on the website)
                  value:
                    id: 01928f6e-0000-7000-8000-000000000005
                    name: Dev Example (illustrative)
                    email: dev@example.com
                    email_verified: true
                    is_platform_admin: false
                    terms: { accepted_version: 1, current_version: 1 }
                    memberships:
                      - org: {id: 01928f6e-0000-7000-8000-0000000000a1, name: Example Solar (illustrative), status: active}
                        role: org_admin
        "401":
          $ref: "#/components/responses/Problem"

  /me/delete:
    post:
      operationId: deleteAccount
      summary: Delete the caller's account
      description: |
        Can't be undone. Erases the login and personal data and ends every
        membership; a company's records of the person's work stay with it.
        400 `account.password_incorrect`; 409 `account.last_admin` or
        `account.platform_admin`.
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountDelete"
      responses:
        "204":
          description: Deleted, and logged out everywhere.
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/Problem"

  /orgs/{org_id}/members:
    parameters:
      - $ref: "#/components/parameters/OrgId"
    get:
      operationId: listMembers
      summary: The org's admin, workers and agents
      description: Org admin only. Used by the admin website's team page.
      tags: [team]
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: role
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/Role"
      responses:
        "200":
          description: One page of members, newest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberPage"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
    post:
      operationId: addMember
      summary: Add a worker or agent
      description: |
        Org admin only. If the email has no account, one is created with no
        password and a set-up email is sent (the person then uses "Set up
        your account", F1). If it has an account, only a membership is
        added and the person is emailed that they were added. One role per
        person per org: `member.already_in_org` (409) otherwise. The role
        must be `worker` or `agent`: `member.role_not_allowed` (422). Agents
        need a `pay_type` (`member.pay_type_required`, 422) and other roles
        can't have one (`member.pay_type_not_allowed`, 422). Someone removed earlier can be added again: their
        membership comes back with the new role and pay type.
      tags: [team]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddMemberRequest"
      responses:
        "201":
          description: Added.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"

  /orgs/{org_id}/members/{user_id}:
    parameters:
      - $ref: "#/components/parameters/OrgId"
      - name: user_id
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/Id"
    delete:
      operationId: removeMember
      summary: Remove a worker or agent from the org
      description: |
        Org admin only. Ends the membership, not the account: it is marked
        removed (kept, not deleted), drops out of the member list and the
        person's `/me`, and their requests to this org get 403
        `org.not_member` at once. The org admin can't be
        removed (`member.cannot_remove_admin`, 422). Their past records
        (jobs, expenses, customers) stay with the org.
      tags: [team]
      responses:
        "204":
          description: Removed.
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
    patch:
      operationId: updateMember
      summary: Change a worker's or agent's role or pay type
      description: |
        Org admin only (F21). `pay_type` (agents) applies from now on:
        customers already registered keep their commission. `role` between
        `worker` and `agent` only when nothing is open in the old role
        (409 `member.has_open_work`, with what's open): an installer's
        tasks assigned, in review or sent back; an agent's customers in
        review or with them, commissions not yet paid, leads new or
        contacted. Becoming an agent needs `pay_type`. The admin's own
        membership can't change (422 `member.cannot_change_admin`). The
        person's name, phone and email are theirs to edit, not here.
      tags: [team]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemberUpdate"
      responses:
        "200":
          description: Done.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"

  /orgs/{org_id}/members/{user_id}/invite:
    parameters:
      - $ref: "#/components/parameters/OrgId"
      - name: user_id
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/Id"
    post:
      operationId: resendInvite
      summary: Send a member's invite again
      description: |
        Org admin only (F21). For a member who hasn't set a password yet:
        the same email as when they were added. 409
        `member.already_set_up` once they have one. At most 3 an hour per
        address (429 `auth.too_many_attempts`).
      tags: [team]
      responses:
        "204":
          description: Sent.
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/Problem"

  /org-registrations:
    post:
      operationId: registerOrg
      summary: A solar company registers with SolaCliq
      description: |
        Public. The server checks the details first: GSTIN format and
        checksum (`org.gstin_invalid`, 422), a GSTIN already registered and
        not rejected (`org.gstin_taken`, 409), and the usual field rules
        (`validation.failed`). PAN and state are taken from the GSTIN.

        Then, in one transaction, it saves the company as `pending`, the
        owner's account (no password; an existing account with this email
        is used as it is) and their `org_admin` membership. MarkCliq is
        emailed to review it, and the owner is emailed that it arrived.
        A platform admin then approves or rejects it
        (`/platform/orgs/{org_id}/status`).
      tags: [onboarding]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrgRegistrationCreate"
      responses:
        "202":
          description: Saved as pending; MarkCliq reviews it.
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/Problem"

  /platform/orgs:
