  responses:
    Problem:
      description: Error, as RFC 9457 problem details.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"

  schemas:
    Health:
      type: object
      required: [status, version, database]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        version:
          type: string
          description: Backend build version.
          examples: ["0.1.0"]
        database:
          type: string
          enum: [ok, unavailable]

    Problem:
      type: object
      description: RFC 9457 problem details.
      required: [type, title, status, code]
      properties:
        type:
          type: string
          format: uri-reference
          examples: ["https://solacliq.markcliq.com/problems/expense.limit_exceeded"]
        title:
          type: string
          description: Short, human-readable summary.
        status:
          type: integer
        detail:
          type: string
          description: What went wrong and what to do, safe to show to the user.
        instance:
          type: string
          format: uri-reference
        code:
          type: string
          description: Machine-readable error code, `<area>.<reason>`.
          examples: ["expense.limit_exceeded"]
        errors:
          type: array
          description: Per-field validation errors.
          items:
            type: object
            required: [field, message]
            properties:
              field:
                type: string
              message:
                type: string

    Id:
      type: string
      format: uuid
      description: UUIDv7.

    Timestamp:
      type: string
      format: date-time
      description: ISO 8601, UTC.

    Money:
      type: integer
      format: int64
      description: Amount in paise (₹1 = 100). Never a float.
      examples: [18500000]

    PageInfo:
      type: object
      required: [next_cursor]
      properties:
        next_cursor:
          type: [string, "null"]
          description: Pass as `cursor` for the next page; null on the last page.

    Email:
      type: string
      format: email
      maxLength: 254
      examples: ["asha@example.com"]

    Phone:
      type: string
      description: Indian mobile number, 10 digits, without +91.
      pattern: "^[6-9][0-9]{9}$"
      examples: ["9876511223"]

    Password:
      type: string
      description: At least 8 characters, including a number.
      minLength: 8
      maxLength: 128
      format: password

    VerificationCode:
      type: string
      pattern: "^[0-9]{6}$"
      description: 6-digit code from the email.
      examples: ["482913"]

    VerifySignupRequest:
      type: object
      required: [email, code]
      properties:
        email:
          $ref: "#/components/schemas/Email"
        code:
          $ref: "#/components/schemas/VerificationCode"

    SignupSetup:
      type: object
      required: [signup_token, expires_in]
      properties:
        signup_token:
          type: string
          description: Single use. Keep it in memory, never in storage or a URL.
        expires_in:
          type: integer
          format: int64
          description: Seconds it works for.
          examples: [900]

    CompleteSignupRequest:
      type: object
      required: [signup_token, name, password, terms_version]
      properties:
        signup_token:
          type: string
        name:
          type: string
          minLength: 1
          maxLength: 100
          examples: ["Asha Example (illustrative)"]
        phone:
          $ref: "#/components/schemas/Phone"
        password:
          $ref: "#/components/schemas/Password"
        terms_version:
          $ref: "#/components/schemas/TermsVersion"

    TermsVersion:
      type: integer
      minimum: 1
      description: |
        The version of the Terms of Use and Privacy Policy the person
        ticked to agree to (F16). Left out, or above the current version,
        is 422 `terms.required`. An older one is recorded as it is; the app
        then asks again after login (`Me.terms`).
      examples: [1]

    TermsStatus:
      type: object
      required: [current_version]
      properties:
        accepted_version:
          type: integer
          description: |
            The latest version the person agreed to. Left out if they never
            have (an account someone else made for them).
          examples: [1]
        current_version:
          type: integer
          description: |
            The version in force. When it differs from `accepted_version`,
            the app shows the "Before you start" screen and nothing else
            until the person agrees (`POST /me/terms`) or logs out.
          examples: [1]

    AcceptTermsRequest:
      type: object
      required: [version]
      properties:
        version:
          type: integer
          description: Must be the current version; anything else is 422 `terms.required`.
          examples: [1]

    EmailRequest:
      type: object
      required: [email]
      properties:
        email:
          $ref: "#/components/schemas/Email"

    LoginRequest:
      type: object
      required: [email, password, client]
      properties:
        email:
          $ref: "#/components/schemas/Email"
        password:
          type: string
          minLength: 1
          maxLength: 128
          format: password
        client:
          type: string
          enum: [app, web]
          description: "`app` gets tokens in the body; `web` gets a session cookie."

    LoginResponse:
      type: object
      required: [user]
      properties:
        user:
          $ref: "#/components/schemas/Me"
        tokens:
          description: "Present for `client: app` only."
          $ref: "#/components/schemas/TokenPair"

    RefreshRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token:
          type: string

    TokenPair:
      type: object
      required: [access_token, refresh_token, access_expires_in, token_type]
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
          description: Single use; the next refresh returns a new one.
        access_expires_in:
          type: integer
          description: Seconds until the access token expires.
          examples: [900]
        token_type:
          type: string
          enum: [Bearer]

    ResetPasswordRequest:
      type: object
      required: [email, code, new_password]
      properties:
        email:
          $ref: "#/components/schemas/Email"
        code:
          $ref: "#/components/schemas/VerificationCode"
        new_password:
          $ref: "#/components/schemas/Password"

    OrgStatus:
      type: string
      description: |
        `pending` until MarkCliq reviews the registration; then `active` or
        `rejected`. `suspended` for non-payment or abuse. Only `active`
        companies give their members any data.
      enum: [pending, active, suspended, rejected]

    Role:
      type: string
      description: |
        `customer`: the company installs for this person; they follow the
        install in the app.
      enum: [org_admin, worker, agent, customer]

    Membership:
      type: object
      required: [org, role]
      properties:
        org:
          type: object
          required: [id, name, status]
          properties:
            id:
              $ref: "#/components/schemas/Id"
            name:
              type: string
              examples: ["Example Solar (illustrative)"]
            status:
              $ref: "#/components/schemas/OrgStatus"
            phone:
              $ref: "#/components/schemas/Phone"
              description: The company's number, for its people to call.
            logo_url:
              type: string
              format: uri
              description: |
                The company's logo (F15), PNG or JPEG: a link that works
                for 15 minutes. Absent when the company has none (the app
                shows its initials). The URL's path stays the same until
                the logo changes, so clients cache the image by it.
              examples: ["https://uploads.mock.invalid/orgs/01928f6e/logo/01928f70"]
        role:
          $ref: "#/components/schemas/Role"
        pay_type:
          $ref: "#/components/schemas/PayType"

    Me:
      type: object
      required: [id, name, email, email_verified, is_platform_admin, memberships, terms]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        name:
          type: string
          examples: ["Asha Example (illustrative)"]
        email:
          $ref: "#/components/schemas/Email"
        phone:
          $ref: "#/components/schemas/Phone"
        email_verified:
          type: boolean
        is_platform_admin:
          type: boolean
        memberships:
          type: array
          description: |
            Every company the person belongs to, including ones that aren't
            active (shown as a message). Removed memberships are left out.
          items:
            $ref: "#/components/schemas/Membership"
        terms:
          $ref: "#/components/schemas/TermsStatus"

    MemberStatus:
      type: string
      description: "`invited` until the person has set a password."
      enum: [invited, active]

    Member:
      type: object
      required: [user_id, name, email, role, status, added_at]
      properties:
        user_id:
          $ref: "#/components/schemas/Id"
        name:
          type: string
          examples: ["Ravi Example (illustrative)"]
        email:
          $ref: "#/components/schemas/Email"
        role:
          $ref: "#/components/schemas/Role"
        pay_type:
          $ref: "#/components/schemas/PayType"
        status:
          $ref: "#/components/schemas/MemberStatus"
        added_at:
          $ref: "#/components/schemas/Timestamp"
        customers:
          type: integer
          format: int64
          description: Customers they registered that weren't turned down.
        open_tasks:
          type: integer
          format: int64
          description: |
            Their tasks not yet approved or cancelled, which stay with them
            if they're removed.

    MemberPage:
      type: object
      required: [items, page]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Member"
        page:
          $ref: "#/components/schemas/PageInfo"

    AddMemberRequest:
      type: object
      required: [name, email, role]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          examples: ["Ravi Example (illustrative)"]
        email:
          $ref: "#/components/schemas/Email"
        role:
          $ref: "#/components/schemas/Role"
        pay_type:
          $ref: "#/components/schemas/PayType"

    MemberUpdate:
      type: object
      properties:
        role:
          type: string
          enum: [worker, agent]
        pay_type:
          $ref: "#/components/schemas/PayType"

    PayType:
      type: string
      enum: [commission, salary]
      description: |
        Agents (shown as Sales) only, and always present for them.
        `commission` agents enter a commission on each customer they add;
        `salary` employees have no commission step. The app treats an agent
        without one as salaried.

    OrgRegistrationCreate:
      type: object
      required: [legal_name, business_type, gstin, address_line_1, city, pin_code, owner_name, email, phone, terms_version]
      properties:
        terms_version:
          $ref: "#/components/schemas/TermsVersion"
          description: |
            The owner agreed to the Terms of Use, the Privacy Policy and the
            Company Terms (two ticks in the form, both required before the
            app sends). Records two agreements: the owner's, and the
            company's with its id. Same rules as `TermsVersion`.
        legal_name:
          type: string
          minLength: 1
          maxLength: 150
          description: As on the GST certificate.
          examples: ["Example Solar Private Limited (illustrative)"]
        trade_name:
          type: string
          maxLength: 150
          description: The name shown in the app. Left out → the legal name.
        business_type:
          $ref: "#/components/schemas/BusinessType"
        gstin:
          type: string
          pattern: "^[0-9]{2}[A-Z]{5}[0-9]{4}[A-Z][1-9A-Z]Z[0-9A-Z]$"
          description: 15 characters; case and spaces don't matter.
          examples: ["27AAPFU0939F1ZV"]
        address_line_1:
          type: string
          minLength: 1
          maxLength: 200
        address_line_2:
          type: string
          maxLength: 200
        city:
          type: string
          minLength: 1
          maxLength: 80
        pin_code:
          type: string
          pattern: "^[1-9][0-9]{5}$"
        owner_name:
          type: string
          minLength: 1
          maxLength: 100
        email:
          $ref: "#/components/schemas/Email"
        phone:
          $ref: "#/components/schemas/Phone"

    BusinessType:
      type: string
      enum: [proprietorship, partnership, llp, private_limited, public_limited, other]

    PlatformOrg:
      type: object
      description: A company as MarkCliq reviews it.
      required: [id, name, legal_name, business_type, gstin, pan, address_line_1, city, state, pin_code, phone, status, owner, created_at]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        name:
          type: string
          description: Shown in the app (the trade name, or the legal name).
        legal_name:
          type: string
        business_type:
          $ref: "#/components/schemas/BusinessType"
        gstin:
          type: string
        pan:
          type: string
          description: Characters 3–12 of the GSTIN.
        address_line_1:
          type: string
        address_line_2:
          type: string
        city:
          type: string
        state:
          type: string
          description: From the GSTIN's first two digits.
        pin_code:
          type: string
        phone:
          $ref: "#/components/schemas/Phone"
        status:
          $ref: "#/components/schemas/OrgStatus"
        owner:
          type: object
          required: [user_id, name, email]
          properties:
            user_id:
              $ref: "#/components/schemas/Id"
            name:
              type: string
            email:
              $ref: "#/components/schemas/Email"
            phone:
              $ref: "#/components/schemas/Phone"
        created_at:
          $ref: "#/components/schemas/Timestamp"
        reviewed_at:
          $ref: "#/components/schemas/Timestamp"
        review_note:
          type: string

    PlatformOrgPage:
      type: object
      required: [items, page]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PlatformOrg"
        page:
          $ref: "#/components/schemas/PageInfo"

    OrgStatusChange:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [active, rejected, suspended]
        note:
          type: string
          maxLength: 1000
          description: Required to reject; emailed to the owner.

    QuoteFor:
      type: string
      enum: [home, business, farm]

    BillBand:
      type: string
      description: Monthly electricity bill, in rupees.
      enum: [under_1500, from_1500_to_3000, from_3000_to_6000, over_6000]

    RoofType:
      type: string
      enum: [rcc, tin_shed, other]

    QuoteTimeline:
      type: string
      enum: [this_month, in_1_to_3_months, exploring]

    QuoteRequestCreate:
      type: object
      required: [quote_for, pin_code, city, bill_band, roof, timeline, share_consent]
      properties:
        quote_for:
          $ref: "#/components/schemas/QuoteFor"
        pin_code:
          type: string
          pattern: "^[1-9][0-9]{5}$"
          examples: ["160055"]
        city:
          type: string
          minLength: 1
          maxLength: 80
          examples: ["Mohali"]
        bill_band:
          $ref: "#/components/schemas/BillBand"
        roof:
          $ref: "#/components/schemas/RoofType"
        timeline:
          $ref: "#/components/schemas/QuoteTimeline"
        phone:
          $ref: "#/components/schemas/Phone"
        share_consent:
          type: boolean
          description: |
            The person agrees to be contacted. Must be true; anything else
            is 422 `quote.consent_required`.

    QuoteEstimate:
      type: object
      required: [kw_min, kw_max, price_min, price_max, subsidy_max]
      properties:
        kw_min:
          type: number
          examples: [4]
        kw_max:
          type: number
          examples: [5]
        price_min:
          $ref: "#/components/schemas/Money"
        price_max:
          $ref: "#/components/schemas/Money"
        subsidy_max:
          $ref: "#/components/schemas/Money"

    QuoteRequest:
      type: object
      required: [id, status, created_at, estimate]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        status:
          type: string
          enum: [open, accepted, closed]
        created_at:
          $ref: "#/components/schemas/Timestamp"
        estimate:
          $ref: "#/components/schemas/QuoteEstimate"
      examples:
        - id: 01928f6e-0000-7000-8000-0000000000c1
          status: open
          created_at: "2026-10-21T10:30:00Z"
          estimate: {kw_min: 4, kw_max: 5, price_min: 24000000, price_max: 29000000, subsidy_max: 7800000}

    HomeTone:
      type: string
      description: |
        A status colour: success (done), warning (due), danger (needs a
        fix), neutral (waiting, booked), live (now, current), empty (to
        come).
      enum: [success, warning, danger, neutral, live, empty]

    HomeVisual:
      type: object
      description: |
        A row's or avatar's picture: one of `image` (a URL, or
        `asset:<name>` in sample data), `initials`, or `glyph` (a drawn
        document or the rupee).
      properties:
        image:
          type: string
        initials:
          type: string
          maxLength: 3
        glyph:
          type: string
          enum: [card, bill, passbook, rupee]

    HomeStatus:
      type: object
      required: [label, tone]
      properties:
        label:
          type: string
        tone:
          $ref: "#/components/schemas/HomeTone"

    HomeRow:
      allOf:
        - $ref: "#/components/schemas/HomeVisual"
        - type: object
          required: [id, title, detail]
          properties:
            id:
              type: string
            title:
              type: string
            detail:
              type: string
            status:
              $ref: "#/components/schemas/HomeStatus"
            action:
              type: string
              description: |
                What tapping it opens: `task` or `customer` (the row's id),
                `documents` or `track`. None: nothing.

    HomeTile:
      type: object
      required: [label, value]
      properties:
        label:
          type: string
        value:
          type: string
        icon:
          type: string
          description: An icon name from the app's set.
          enum: [camera, receipt, alarm, hourglass, shield, wallet, sun, users]
        footer:
          type: string
        dark:
          type: boolean
          default: false
        avatars:
          type: array
          items:
            $ref: "#/components/schemas/HomeVisual"
        action:
          type: string
          description: What tapping it opens, if anything.

    HomeDay:
      type: object
      required: [day, date, dots]
      properties:
        day:
          type: string
        date:
          type: integer
        today:
          type: boolean
          default: false
        dots:
          type: array
          items:
            type: string
            enum: [done, live, planned]

    HomeSegment:
      type: object
      required: [weight, tone]
      properties:
        weight:
          type: integer
          minimum: 1
        tone:
          $ref: "#/components/schemas/HomeTone"
        label:
          type: string
          description: For the legend.

    HomeProgress:
      type: object
      required: [label, segments]
      properties:
        label:
          type: string
        trailing:
          type: string
        segments:
          type: array
          items:
            $ref: "#/components/schemas/HomeSegment"
        stages:
          type: array
          description: Names spread under the bar.
          items:
            type: string
        legend:
          type: boolean
          default: false
          description: Shows each segment's label with a dot under the bar.

    HomeEnergy:
      type: object
      required: [now_kw, today_kwh, sunrise, sunset, day_progress, hours, now_index]
      properties:
        now_kw:
          type: number
        today_kwh:
          type: number
        sunrise:
          type: string
          examples: ["06:12"]
        sunset:
          type: string
          examples: ["17:41"]
        day_progress:
          type: number
          minimum: 0
          maximum: 1
        hours:
          type: array
          description: kWh per daylight hour, from sunrise.
          items:
            type: number
        now_index:
          type: integer

    HomeSummary:
      type: object
      required: [eyebrow, title, tiles, list]
      properties:
        unread_notifications:
          type: integer
          minimum: 0
          description: Shows a dot on the bell when above zero.
        eyebrow:
          type: string
        title:
          type: string
        headline:
          type: object
          required: [value, label]
          properties:
            value:
              type: string
            label:
              type: string
            detail:
              type: string
        week:
          type: array
          items:
            $ref: "#/components/schemas/HomeDay"
        energy:
          $ref: "#/components/schemas/HomeEnergy"
        attendance:
          $ref: "#/components/schemas/HomeAttendance"
        tiles:
          type: array
          maxItems: 2
          items:
            $ref: "#/components/schemas/HomeTile"
        progress:
          $ref: "#/components/schemas/HomeProgress"
        list:
          type: object
          required: [rows]
          properties:
            title:
              type: string
            rows:
              type: array
              items:
                $ref: "#/components/schemas/HomeRow"

    HomeAttendance:
      type: object
      description: |
        The attendance card (F17). Present for installers and salaried
        sales only.
      required: [state]
      properties:
        state:
          type: string
          description: |
            Today in India. `not_started`: no day today (yesterday's,
            even without an end, doesn't count); `working`: today's `day`
            has no end yet; `ended`: today's `day` has ended.
          enum: [not_started, working, ended]
        day:
          $ref: "#/components/schemas/AttendanceDay"

    UploadCreate:
      type: object
      required: [content_type, size_bytes, purpose]
      properties:
        content_type:
          type: string
          enum: [image/jpeg, image/png, application/pdf]
        size_bytes:
          type: integer
          minimum: 1
          maximum: 52428800
          description: "The file's exact size. Up to 50 MB for `kyc`, 10 MB for `receipt` and `proof`, 1 MB for `logo`."
        purpose:
          type: string
          enum: [receipt, kyc, proof, logo]
          description: "`proof`: a task's photo from the live camera. `logo`: the company's logo (F15), org admin only, PNG or JPEG up to 1 MB."

    LogoSet:
      type: object
      required: [upload_id]
      properties:
        upload_id:
          $ref: "#/components/schemas/Id"

    Upload:
      type: object
      required: [upload_id, url, method, headers, expires_at]
      properties:
        upload_id:
          $ref: "#/components/schemas/Id"
        url:
          type: string
          format: uri
          examples: ["https://uploads.mock.invalid/01928f6e"]
        method:
          type: string
          enum: [PUT]
        headers:
          type: object
          additionalProperties:
            type: string
