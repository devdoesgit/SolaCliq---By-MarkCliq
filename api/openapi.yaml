components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: Access token, used by the mobile app.
    cookie:
      type: apiKey
      in: cookie
      name: solacliq_session
      description: Session cookie, used by the admin website.

  parameters:
    CustomerId:
      name: customer_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Id"
    TaskId:
      name: task_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Id"
    ExpenseId:
      name: expense_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Id"
    InviteId:
      name: invite_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Id"
    OrgId:
      name: org_id
      in: path
      required: true
      description: The org the request is for; the caller needs a membership in it.
      schema:
        $ref: "#/components/schemas/Id"
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque cursor from the previous page's `next_cursor`.
      schema:
        type: string
    Limit:
      name: limit
      in: query
      required: false
      description: Page size.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        Unique per logical write (UUID). Sent on writes from the mobile app
        so a retry after a lost response never creates a duplicate.
      schema:
        type: string
        format: uuid

