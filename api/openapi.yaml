                ready:
                  $ref: "#/components/examples/Task_ready"
                submitted:
                  $ref: "#/components/examples/Task_submitted"
                returned:
                  $ref: "#/components/examples/Task_returned"
                reported:
                  $ref: "#/components/examples/Task_reported"
                cancelled:
                  $ref: "#/components/examples/Task_cancelled"
                approved:
                  $ref: "#/components/examples/Task_approved"
