openapi: 3.1.0
info:
  title: SolaCliq API
  version: 0.5.0
  contact:
    name: MarkCliq
    url: https://markcliq.com
    email: info@markcliq.com
  description: |
    Contract between the SolaCliq backend, mobile app and admin website.
    Conventions are in docs/architecture.md under "API conventions":
    money in integer paise, UUIDv7 ids, ISO 8601 UTC timestamps, cursor
    pagination, RFC 9457 errors.
servers:
  - url: https://solacliq.markcliq.com/api/v1
    description: Production
  - url: http://localhost:4010
    description: Prism mock (make mock)

security:
  - bearer: []
  - cookie: []

tags:
  - name: system
    description: Service status.
  - name: auth
    description: Accounts, login and sessions (F1).
  - name: team
    description: An org's workers and agents (F3).
  - name: onboarding
    description: Solar companies asking for SolaCliq, and invites to join one.
  - name: quotes
    description: People without an installer asking for a solar quote (leads).
  - name: home
    description: What each home screen shows.
  - name: expenses
    description: Workers and agents logging costs for approval (F7).
  - name: customers
    description: Agents registering customers with their KYC (F4).
  - name: uploads
    description: Files go straight to storage through presigned URLs.
  - name: tasks
    description: A worker's assigned work, proof photos and approvals (F6).
  - name: notifications
    description: What changed for the caller in one company (F12).
  - name: profile
    description: The person's details, documents and settings.
  - name: install
    description: A customer's own install and payments.

paths:
  /health:
    get:
      operationId: getHealth
      summary: Service health
      description: |
        Whether the API and its database are up. Needs no authentication.
        503 with the same body when the database can't be reached.
      tags: [system]
      security: []
      responses:
        "200":
          description: The API is up.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          description: The API is up but the database is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"

  /auth/signup:
    post:
      operationId: signup
      summary: Create a customer account
      description: |
        Creates an unverified account and emails a 6-digit code. Always 202,
        whether or not the email already has an account (no enumeration);
        an existing account gets an "you already have an account" email.
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignupRequest"
      responses:
        "202":
          description: Accepted; a code is on its way if the email is new.
        "422":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/Problem"

  /auth/email/verify:
    post:
      operationId: verifyEmail
      summary: Verify an email with its code
      description: |
        Marks the email verified so the account can log in. Codes last 5
        minutes and allow 5 tries; after that, request a new one.
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyEmailRequest"
      responses:
        "204":
          description: Email verified; the account can log in.
        "400":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/Problem"

  /auth/email/resend:
    post:
      operationId: resendVerification
      summary: Send a new verification code
      description: Always 202 (no enumeration).
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailRequest"
      responses:
        "202":
          description: Accepted.
        "429":
          $ref: "#/components/responses/Problem"

  /auth/login:
    post:
      operationId: login
      summary: Log in
      description: |
        `client: app` returns a token pair in the body. `client: web` sets
        the session cookie and returns no tokens. Wrong email and wrong
        password give the same `auth.invalid_credentials`; an unverified
        account gets `account.email_unverified` only after the right
        password. An account created for someone (by an agent or org admin)
        that has no password yet gets 403 `account.password_not_set`; the
        person sets one through /auth/password/forgot and /reset.
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Logged in.
          headers:
            Set-Cookie:
              description: |
                Web clients only. `solacliq_session`, HttpOnly, Secure,
                SameSite=Lax, Path=/, Max-Age 12 hours. (The example omits
                Secure so the mock works over plain HTTP in development.)
              schema:
                type: string
              example: solacliq_session=mock-session; Path=/; HttpOnly; SameSite=Lax; Max-Age=43200
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
              examples:
                personal:
                  summary: A person with no company (a normal user)
                  value:
                    {"user": {"id": "01928f6e-0000-7000-8000-000000000001", "name": "Asha Example (illustrative)", "email": "asha@example.com", "email_verified": true, "is_platform_admin": false, "memberships": []}, "tokens": {"access_token": "mock-access", "refresh_token": "mock-refresh", "access_expires_in": 900, "token_type": "Bearer"}}
                customer:
                  summary: A customer whose installer added them
                  value:
                    {"user": {"id": "01928f6e-0000-7000-8000-000000000006", "name": "Rajinder Example (illustrative)", "email": "rajinder@example.com", "email_verified": true, "is_platform_admin": false, "memberships": [{"org": {"id": "01928f6e-0000-7000-8000-0000000000a1", "name": "Example Solar (illustrative)", "status": "active"}, "role": "customer"}]}, "tokens": {"access_token": "mock-access", "refresh_token": "mock-refresh", "access_expires_in": 900, "token_type": "Bearer"}}
                worker:
                  summary: A worker in one org
                  value:
                    {"user": {"id": "01928f6e-0000-7000-8000-000000000002", "name": "Ravi Example (illustrative)", "email": "ravi@example.com", "email_verified": true, "is_platform_admin": false, "memberships": [{"org": {"id": "01928f6e-0000-7000-8000-0000000000a1", "name": "Example Solar (illustrative)", "status": "active"}, "role": "worker"}]}, "tokens": {"access_token": "mock-access", "refresh_token": "mock-refresh", "access_expires_in": 900, "token_type": "Bearer"}}
                agent:
                  summary: An agent in one org
                  value:
                    {"user": {"id": "01928f6e-0000-7000-8000-000000000003", "name": "Meena Example (illustrative)", "email": "meena@example.com", "email_verified": true, "is_platform_admin": false, "memberships": [{"org": {"id": "01928f6e-0000-7000-8000-0000000000a1", "name": "Example Solar (illustrative)", "status": "active"}, "role": "agent"}]}, "tokens": {"access_token": "mock-access", "refresh_token": "mock-refresh", "access_expires_in": 900, "token_type": "Bearer"}}
                multi_org:
                  summary: An agent in two orgs and a worker in a third, one suspended
                  value:
                    {"user": {"id": "01928f6e-0000-7000-8000-000000000004", "name": "Kiran Example (illustrative)", "email": "kiran@example.com", "email_verified": true, "is_platform_admin": false, "memberships": [{"org": {"id": "01928f6e-0000-7000-8000-0000000000a1", "name": "Example Solar (illustrative)", "status": "active"}, "role": "agent"}, {"org": {"id": "01928f6e-0000-7000-8000-0000000000a2", "name": "Sample Rooftops (illustrative)", "status": "active"}, "role": "agent"}, {"org": {"id": "01928f6e-0000-7000-8000-0000000000a3", "name": "Demo Power (illustrative)", "status": "suspended"}, "role": "worker"}]}, "tokens": {"access_token": "mock-access", "refresh_token": "mock-refresh", "access_expires_in": 900, "token_type": "Bearer"}}
                org_admin:
                  summary: An org admin (their tools are on the website)
                  value:
                    {"user": {"id": "01928f6e-0000-7000-8000-000000000005", "name": "Dev Example (illustrative)", "email": "dev@example.com", "email_verified": true, "is_platform_admin": false, "memberships": [{"org": {"id": "01928f6e-0000-7000-8000-0000000000a1", "name": "Example Solar (illustrative)", "status": "active"}, "role": "org_admin"}]}, "tokens": {"access_token": "mock-access", "refresh_token": "mock-refresh", "access_expires_in": 900, "token_type": "Bearer"}}
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/Problem"

  /auth/refresh:
    post:
      operationId: refreshSession
      summary: Get a new token pair (app)
      description: |
        Rotates the refresh token. Reusing an already-used refresh token
        revokes that login and returns 401 `auth.session_expired`.
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: New tokens.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPair"
        "401":
          $ref: "#/components/responses/Problem"

  /auth/logout:
    post:
      operationId: logout
      summary: Log out of this session
      description: Web clients also get the cookie cleared.
      tags: [auth]
      responses:
        "204":
          description: Logged out.
          headers:
            Set-Cookie:
              description: Web clients only. Clears `solacliq_session`.
              schema:
                type: string
              example: solacliq_session=; Path=/; HttpOnly; SameSite=Lax; Max-Age=0
        "401":
          $ref: "#/components/responses/Problem"

  /auth/password/forgot:
    post:
      operationId: forgotPassword
      summary: Email a password reset or set-up code
      description: |
        Always 202 (no enumeration). Also used to set a first password on an
        account created for someone. Codes last 5 minutes.
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailRequest"
      responses:
        "202":
          description: Accepted.
        "429":
          $ref: "#/components/responses/Problem"

  /auth/password/reset:
    post:
      operationId: resetPassword
      summary: Set a new password with the reset code
      description: Ends every session of the account.
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordRequest"
      responses:
        "204":
          description: Password changed; log in again.
        "400":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/Problem"

  /me:
    get:
      operationId: getMe
      summary: The signed-in person and their memberships
      description: Used by both apps on start-up to restore the session.
      tags: [auth]
      responses:
        "200":
          description: The current user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
              examples:
                personal:
                  summary: A person with no company (a normal user)
                  value:
                    id: 01928f6e-0000-7000-8000-000000000001
                    name: Asha Example (illustrative)
                    email: asha@example.com
                    email_verified: true
                    is_platform_admin: false
                    memberships: []
                customer:
                  summary: A customer whose installer added them
                  value:
                    id: 01928f6e-0000-7000-8000-000000000006
                    name: Rajinder Example (illustrative)
                    email: rajinder@example.com
                    email_verified: true
                    is_platform_admin: false
                    memberships:
                      - org: {id: 01928f6e-0000-7000-8000-0000000000a1, name: Example Solar (illustrative), status: active}
                        role: customer
                worker:
                  summary: A worker in one org
                  value:
                    id: 01928f6e-0000-7000-8000-000000000002
                    name: Ravi Example (illustrative)
                    email: ravi@example.com
                    email_verified: true
                    is_platform_admin: false
                    memberships:
                      - org: {id: 01928f6e-0000-7000-8000-0000000000a1, name: Example Solar (illustrative), status: active}
                        role: worker
                agent:
                  summary: An agent in one org
                  value:
                    id: 01928f6e-0000-7000-8000-000000000003
                    name: Meena Example (illustrative)
                    email: meena@example.com
                    email_verified: true
                    is_platform_admin: false
                    memberships:
                      - org: {id: 01928f6e-0000-7000-8000-0000000000a1, name: Example Solar (illustrative), status: active, phone: "9814000000"}
                        role: agent
                        pay_type: commission
                sales:
                  summary: A salaried sales employee in one org
                  value:
                    id: 01928f6e-0000-7000-8000-000000000007
                    name: Aman Example (illustrative)
                    email: aman@example.com
                    email_verified: true
                    is_platform_admin: false
                    memberships:
                      - org: {id: 01928f6e-0000-7000-8000-0000000000a1, name: Example Solar (illustrative), status: active, phone: "9814000000"}
                        role: agent
                        pay_type: salary
                multi_org:
                  summary: An agent in two orgs and a worker in a third, one suspended
                  value:
                    id: 01928f6e-0000-7000-8000-000000000004
                    name: Kiran Example (illustrative)
                    email: kiran@example.com
                    email_verified: true
                    is_platform_admin: false
                    memberships:
                      - org: {id: 01928f6e-0000-7000-8000-0000000000a1, name: Example Solar (illustrative), status: active}
                        role: agent
                      - org: {id: 01928f6e-0000-7000-8000-0000000000a2, name: Sample Rooftops (illustrative), status: active}
                        role: agent
                      - org: {id: 01928f6e-0000-7000-8000-0000000000a3, name: Demo Power (illustrative), status: suspended}
                        role: worker
                org_admin:
                  summary: An org admin (their tools are on the website)
                  value:
                    id: 01928f6e-0000-7000-8000-000000000005
                    name: Dev Example (illustrative)
                    email: dev@example.com
                    email_verified: true
                    is_platform_admin: false
                    memberships:
                      - org: {id: 01928f6e-0000-7000-8000-0000000000a1, name: Example Solar (illustrative), status: active}
                        role: org_admin
        "401":
          $ref: "#/components/responses/Problem"

  /orgs/{org_id}/members:
    parameters:
      - $ref: "#/components/parameters/OrgId"
    get:
      operationId: listMembers
      summary: The org's admin, workers and agents
      description: Org admin only. Used by the admin website's team page.
      tags: [team]
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: role
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/Role"
      responses:
        "200":
          description: One page of members, newest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberPage"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
    post:
      operationId: addMember
      summary: Add a worker or agent
      description: |
        Org admin only. If the email has no account, one is created with no
        password and a set-up email is sent (the person then uses "Set up
        your account", F1). If it has an account, only a membership is
        added and the person is emailed that they were added. One role per
        person per org: `member.already_in_org` (409) otherwise. The role
        must be `worker` or `agent`: `member.role_not_allowed` (422).
      tags: [team]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddMemberRequest"
      responses:
        "201":
          description: Added.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"

  /orgs/{org_id}/members/{user_id}:
    parameters:
      - $ref: "#/components/parameters/OrgId"
      - name: user_id
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/Id"
    delete:
      operationId: removeMember
      summary: Remove a worker or agent from the org
      description: |
        Org admin only. Ends the membership, not the account; the person's
        sessions stop working for this org at once. The org admin can't be
        removed (`member.cannot_remove_admin`, 422). Their past records
        (jobs, expenses, customers) stay with the org.
      tags: [team]
      responses:
        "204":
          description: Removed.
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"

  /access-requests:
    post:
      operationId: requestAccess
      summary: A solar company asks for SolaCliq
      description: |
        Public. MarkCliq is notified and onboards the company; its admin
        then gets the web dashboard. Always 202.
      tags: [onboarding]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccessRequestCreate"
      responses:
        "202":
          description: Received; MarkCliq will be in touch.
        "422":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/Problem"

  /me/invites:
    get:
      operationId: listMyInvites
      summary: Invites waiting for the signed-in person
      description: Shown as a banner on the personal home until answered.
      tags: [onboarding]
      responses:
        "200":
          description: Pending invites, newest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InviteList"
              examples:
                none:
                  summary: Nothing waiting
                  value: {items: []}
                one:
                  summary: A company invited the person as a worker (illustrative)
                  value:
                    items:
                      - id: 01928f6e-0000-7000-8000-0000000000e1
                        org: {id: 01928f6e-0000-7000-8000-0000000000a1, name: Example Solar (illustrative)}
                        role: worker
                        invited_by: Dev Example (illustrative)
                        invited_at: "2026-10-21T09:00:00Z"
        "401":
          $ref: "#/components/responses/Problem"

  /invites/{invite_id}/accept:
    parameters:
      - $ref: "#/components/parameters/InviteId"
    post:
      operationId: acceptInvite
      summary: Join the company that sent the invite
      description: Adds the membership and returns the updated person.
      tags: [onboarding]
      responses:
        "200":
          description: Joined.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
              examples:
                worker:
                  summary: Now a worker at the company (illustrative)
                  value:
                    id: 01928f6e-0000-7000-8000-000000000001
                    name: Asha Example (illustrative)
                    email: asha@example.com
                    email_verified: true
                    is_platform_admin: false
                    memberships:
                      - org: {id: 01928f6e-0000-7000-8000-0000000000a1, name: Example Solar (illustrative), status: active}
                        role: worker
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"

  /invites/{invite_id}/decline:
    parameters:
      - $ref: "#/components/parameters/InviteId"
    post:
      operationId: declineInvite
      summary: Turn down an invite
      description: The person keeps their account; nothing is shared.
      tags: [onboarding]
      responses:
        "204":
          description: Declined; the company is told.
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"

  /quote-requests:
    post:
      operationId: createQuoteRequest
      summary: Ask verified solar companies nearby for a quote
      description: |
        Creates a lead that companies near the PIN code can accept; the one
        that accepts contacts the person on their phone (the account's, or
        `phone` here if the account has none; 422 `quote.phone_required` if
        neither). Returns an indicative estimate from the bill band.
      tags: [quotes]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuoteRequestCreate"
      responses:
        "201":
          description: Sent.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuoteRequest"
        "401":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"

  /orgs/{org_id}/home:
    parameters:
      - $ref: "#/components/parameters/OrgId"
    get:
      operationId: getOrgHome
      summary: The home screen for the caller's role in this company
      description: |
        The server composes it for the role, from the same parts: a worker's
        week and tasks, an agent's customers and KYC, a customer's install
        progress, or their live energy after handover. Images are URLs;
        sample data uses `asset:<name>` for pictures bundled in the app.
      tags: [home]
      responses:
        "200":
          description: The home.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HomeSummary"
              examples:
                worker:
                  summary: A worker's day (illustrative)
                  value: {"eyebrow": "Thursday, 23 Oct", "title": "Suresh's day", "headline": {"value": "3", "label": "tasks", "detail": "on site today"}, "week": [{"day": "Mon", "date": 20, "dots": ["done", "done"]}, {"day": "Tue", "date": 21, "dots": ["done"]}, {"day": "Wed", "date": 22, "dots": ["done", "done", "done"]}, {"day": "Thu", "date": 23, "today": true, "dots": ["live", "live", "planned"]}, {"day": "Fri", "date": 24, "dots": ["planned"]}, {"day": "Sat", "date": 25, "dots": ["planned"]}, {"day": "Sun", "date": 26, "dots": []}], "tiles": [{"label": "To submit", "value": "2", "icon": "camera", "footer": "today", "dark": true, "avatars": [{"image": "asset:thumb-install"}, {"image": "asset:thumb-inverter"}], "action": "to_submit"}, {"label": "Expenses", "value": "1", "icon": "receipt", "footer": "with admin", "avatars": [{"glyph": "rupee"}], "action": "expenses"}], "list": {"title": "Up next", "rows": [{"id": "01928f6e-0000-7000-8000-000000000a01", "image": "asset:thumb-install", "title": "Ramesh Sahoo (illustrative)", "detail": "Panel installation · 9:30", "status": {"label": "Assigned", "tone": "live"}, "action": "task"}, {"id": "01928f6e-0000-7000-8000-000000000a03", "image": "asset:thumb-inverter", "title": "Priya Nair (illustrative)", "detail": "Wiring · 13:00 · 7.8 km", "status": {"label": "Assigned", "tone": "live"}, "action": "task"}, {"id": "01928f6e-0000-7000-8000-000000000a04", "image": "asset:thumb-meter", "title": "Kiran Patel (illustrative)", "detail": "Net meter · awaiting admin", "status": {"label": "In review", "tone": "neutral"}, "action": "task"}]}, "unread_notifications": 3}
                agent:
                  summary: A commission agent's customers (illustrative)
