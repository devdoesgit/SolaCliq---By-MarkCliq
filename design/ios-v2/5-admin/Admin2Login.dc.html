<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Admin · Log in</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="width: 1280px; height: 800px; display: flex; background: #FBF8F4; color: #2A1F19; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Inter', system-ui, sans-serif; -webkit-font-smoothing: antialiased">
      <div style="flex: 1; position: relative; overflow: hidden"><img src="img/hero-install.jpg" alt="Installer fitting rooftop solar panels" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover"><span style="position: absolute; inset: 0; background: linear-gradient(180deg, rgba(20,14,10,0) 50%, rgba(20,14,10,0.7) 100%)"></span>
        <div style="position: absolute; left: 40px; bottom: 40px; right: 40px; color: #FFFFFF; display: flex; flex-direction: column; gap: 8px"><span style="font-size: 36px; line-height: 40px; font-weight: 700; letter-spacing: -0.04em">Run every install from one place.</span><span style="font-size: 16px; color: rgba(255,255,255,0.85)">Tasks, customers, commissions and expenses for your EPC.</span></div></div>
      <div style="width: 480px; padding: 64px 56px; box-sizing: border-box; display: flex; flex-direction: column; gap: 18px; justify-content: center">
        <span style="display: flex; align-items: center; gap: 10px"><span style="width: 34px; height: 34px; border-radius: 10px; background: #F6C445; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"></path></svg></span><span style="font-size: 18px; font-weight: 700">SolaCliq <span style="font-weight: 500; color: #8C7F74">for EPCs</span></span></span>
        <span style="font-size: 34px; line-height: 38px; font-weight: 700; letter-spacing: -0.04em; margin-top: 12px">Admin log in</span>
        <div style="display: flex; flex-direction: column; gap: 6px"><span style="font-size: 13px; font-weight: 600; color: #8C7F74">Work email</span><input value="rajeeb@arkasolar.in" aria-label="Work email" style="height: 44px; padding: 0 14px; border: 0; border-radius: 14px; background: #FFFFFF; box-shadow: inset 0 0 0 1px #E2D7CB; font-size: 15px; font-weight: 500; color: #2A1F19; outline: none; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Inter', system-ui, sans-serif"></div>
        <div style="display: flex; flex-direction: column; gap: 6px"><span style="font-size: 13px; font-weight: 600; color: #8C7F74">Password</span><input value="••••••••••" aria-label="Password" style="height: 44px; padding: 0 14px; border: 0; border-radius: 14px; background: #FFFFFF; box-shadow: inset 0 0 0 1px #E2D7CB; font-size: 15px; font-weight: 500; color: #2A1F19; outline: none; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Inter', system-ui, sans-serif"></div>
        <sc-if value="{{resetShown}}" hint-placeholder-val="{{false}}"><div role="status" style="flex: none; display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-radius: 16px; background: #E1F1E4; color: #2E7445; font-size: 14px; font-weight: 600"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg><span>Reset link sent to rajeeb@arkasolar.in</span></div></sc-if>
        <a href="Admin2Overview.dc.html" style="display: flex; align-items: center; justify-content: center; height: 50px; border-radius: 999px; background: #F6C445; color: #2A1F19; font-size: 16px; font-weight: 700; text-decoration: none; box-shadow: 0 8px 20px rgba(201,151,26,0.3)">Log in</a>
        <button type="button" onClick="{{forgot}}" style="border: 0; background: none; font-size: 14px; font-weight: 600; color: #8A6440; cursor: pointer; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Inter', system-ui, sans-serif">Forgot password?</button>
        <span style="font-size: 12px; color: #8C7F74; text-align: center">Your EPC account is set up by MarkCliq.</span>
      </div></div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = {"r": false};
  }
  renderVals() {
    const s = this.state;
    const set = (o) => () => this.setState(o);
    return { resetShown: s.r, forgot: set({ r: true }) };
  }
}
</script>
</body>
</html>
